# UP Robotics FTC Helper — ingestion config (safe to commit; no secrets here).
# Secrets live in the Mac mini Keychain:  security add-generic-password -s ftc-index -a cf-api-token -w
#                                          security add-generic-password -s ftc-index -a monitor-ping-url -w

cloudflare:
  account_id: "181ef16e10d373bc7ffc49d94d3d814b"   # Cloudflare account ID (dashboard URL). Not secret.
  instance: ftc-2026        # AI Search instance name (default namespace)

paths:
  state_dir: ~/Library/Application Support/ftc-index
  log_dir: ~/Library/Logs/ftc-index
  yt_dlp: /opt/homebrew/bin/yt-dlp

season:
  label: "2026-27"
  starts: 2026-09-01        # videos published on/after this date are labeled with `label`

youtube:
  defaults:
    include_shorts: false
    include_streams: true
    backfill_per_day: 150   # max videos fetched per run
    max_duration_seconds: 7200   # skip videos and streams longer than 2 hours (Tarun, 2026-09-12)
    delay_seconds: [5, 15]  # random pause between videos
    reconcile_weekday: 6    # Sunday: weekly flat-playlist rediscovery + item reconcile
  channels:
    - { name: FIRST Tech Challenge, id: UCkWMXdRQr5yoZRz7gFYyRcw }
    - { name: Brogan M. Pratt,      id: UCWaxzmMG0w8AmKaUYIxcx5Q }
    - { name: FTC Protostars,       id: UC48x8ssvxFszwzmCyYpY8oQ }
    - { name: FUN Robotics Network, id: UCuJUknE5JjilAfNnmbvr22Q,
        title_include: ["FTC", "FIRST Tech"], published_after: 2025-09-01 }
    - { name: Wizards.exe FTC 9794, id: UC988iYaWDOF7Fpv6HqN-wjQ }

# Documentation websites (added 2026-09-12). Fetched by our script once a week (reconcile weekday) or with `ftc_index.py web`.
# AI Search's own website crawler only accepts domains on this Cloudflare account, so these are fetched like the manual.
web_sources:
  - id: gm0
    name: Game Manual 0 (gm0.org), community FTC design guide
    source_type: guide
    kind: sphinx
    base: https://gm0.org/en/latest/
    selector: article
    include: ["docs/"]
    license: CC BY-NC 2.0
    enabled: true    # Tarun 2026-09-12: index it; gm0 is CC BY-NC 2.0, credited in every unit header and in the page footer
    note: Community-written design and strategy guide. Advice and examples, not game rules.
  - id: ftcdocs
    name: FTC Docs (ftc-docs.firstinspires.org), official FIRST Tech Challenge programming and control system documentation
    source_type: docs
    kind: sphinx
    base: https://ftc-docs.firstinspires.org/en/latest/
    selector: "div[role=main]"
    note: Official FIRST programming, hardware, and control system documentation. Not the game rules; the Competition Manual governs rules.
  - id: revdocs
    name: REV Robotics documentation (docs.revrobotics.com)
    source_type: vendor_docs
    kind: sitemap
    base: https://docs.revrobotics.com/
    selector: main
    markdown_suffix: ".md"
    include_sitemaps: ["duo", "ftc-kickoff", "rev-hardware-client", "rev-crossover-products", "docs.revrobotics.com/sitemap-pages.xml"]
    note: Vendor documentation for REV DUO hardware and the Control Hub. Product guidance, not game rules.
