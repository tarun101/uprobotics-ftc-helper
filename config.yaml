# UP Robotics FTC Helper — ingestion config (safe to commit; no secrets here).
# Secrets live in the Mac mini Keychain:  security add-generic-password -s ftc-index -a cf-api-token -w
#                                          security add-generic-password -s ftc-index -a monitor-ping-url -w

cloudflare:
  account_id: "181ef16e10d373bc7ffc49d94d3d814b"   # Cloudflare account ID (dashboard URL). Not secret.
  instance: ftc-2026        # AI Search instance name (default namespace)

paths:
  state_dir: ~/Library/Application Support/ftc-index
  log_dir: ~/Library/Logs/ftc-index
  yt_dlp: /opt/homebrew/bin/yt-dlp

season:
  label: "2026-27"
  starts: 2026-09-01        # videos published on/after this date are labeled with `label`

youtube:
  defaults:
    include_shorts: false
    include_streams: true
    backfill_per_day: 150   # max videos fetched per run
    max_duration_seconds: 7200   # skip videos and streams longer than 2 hours (Tarun, 2026-09-12)
    delay_seconds: [10, 25] # random pause between videos (5–15 s drew an HTTP 429 after ~120 fetches on 2026-09-12)
    reconcile_weekday: 6    # Sunday: weekly flat-playlist rediscovery + item reconcile
  channels:
    - { name: FIRST Tech Challenge, id: UCkWMXdRQr5yoZRz7gFYyRcw }
    - { name: Brogan M. Pratt,      id: UCWaxzmMG0w8AmKaUYIxcx5Q }
    - { name: FTC Protostars,       id: UC48x8ssvxFszwzmCyYpY8oQ }
    - { name: FUN Robotics Network, id: UCuJUknE5JjilAfNnmbvr22Q,
        title_include: ["FTC", "FIRST Tech"], published_after: 2025-09-01 }
    - { name: Wizards.exe FTC 9794, id: UC988iYaWDOF7Fpv6HqN-wjQ }

# Weekly 30-question retrieval check (tests/run_questions.py --grade), run by `ftc_index.py run` on the reconcile weekday
# and by `ftc_index.py test`. Below the pass mark it signals the Monitor (<ping URL>/fail) and the run exits non-zero.
tests:
  weekly: true
  endpoint: https://ftc.uprobotics.tech/api
  fail_ping: true
  commit: true              # git-commit the results file under tests/results/ (no push)

# Documentation websites (added 2026-09-12). Fetched by our script once a week (reconcile weekday) or with `ftc_index.py web`.
# AI Search's own website crawler only accepts domains on this Cloudflare account, so these are fetched like the manual.
web_sources:
  - id: gm0
    name: Game Manual 0 (gm0.org), community FTC design guide
    source_type: guide
    kind: sphinx
    base: https://gm0.org/en/latest/
    selector: article
    include: ["docs/"]
    license: CC BY-NC 2.0
    enabled: true    # Tarun 2026-09-12: index it; gm0 is CC BY-NC 2.0, credited in every unit header and in the page footer
    note: Community-written design and strategy guide. Advice and examples, not game rules.
  - id: ftcdocs
    name: FTC Docs (ftc-docs.firstinspires.org), official FIRST Tech Challenge programming and control system documentation
    source_type: docs
    kind: sphinx
    base: https://ftc-docs.firstinspires.org/en/latest/
    selector: "div[role=main]"
    note: Official FIRST programming, hardware, and control system documentation. Not the game rules; the Competition Manual governs rules.
  - id: revdocs
    name: REV Robotics documentation (docs.revrobotics.com)
    source_type: vendor_docs
    kind: sitemap
    base: https://docs.revrobotics.com/
    selector: main
    markdown_suffix: ".md"
    include_sitemaps: ["duo", "ftc-kickoff", "rev-hardware-client", "rev-crossover-products", "docs.revrobotics.com/sitemap-pages.xml"]
    note: Vendor documentation for REV DUO hardware and the Control Hub. Product guidance, not game rules.

  # --- BIOBUZZ digest additions (2026-09-16). Advice/docs/resources — not Competition Manual rules. ---
  - id: first-field
    name: FIRST Playing Field Resources (ftc-resources field hub + linked field PDFs)
    source_type: field_resources
    kind: hub
    base: https://ftc-resources.firstinspires.org/
    seeds: ["https://ftc-resources.firstinspires.org/ftc/field"]
    include: ["/ftc/field"]
    allow_pdf: true
    exclude: [".zip", "field-cad"]
    selector: "body"
    min_items: 1
    note: Official FIRST playing-field setup and CAD hub. Resource PDFs and guides, not game rules; the Competition Manual governs rules.
  - id: first-team
    name: FIRST Robot and Team Resources (2026-27 / archive 2027)
    source_type: team_resources
    kind: hub
    base: https://ftc-resources.firstinspires.org/
    seeds: ["https://ftc-resources.firstinspires.org/ftc/archive/2027/team"]
    include: ["/ftc/archive/2027/team"]
    allow_pdf: true
    selector: "body"
    min_items: 1
    note: Official FIRST robot and team resource hub for the current season archive. Advice and printable resources, not game rules.
  - id: first-event
    name: FIRST Event Resources and Materials (2026-27 / archive 2027)
    source_type: event_resources
    kind: hub
    base: https://ftc-resources.firstinspires.org/
    seeds: ["https://ftc-resources.firstinspires.org/ftc/archive/2027/event"]
    include: ["/ftc/archive/2027/event"]
    allow_pdf: true
    selector: "body"
    min_items: 1
    note: Official FIRST event operations resources (inspection, networking, league guides). Event logistics docs, not game rules.
  - id: first-season-overview
    name: Official FIRST Tech Challenge Game and Season overview (firstinspires.org)
    source_type: season_overview
    kind: pages
    base: https://www.firstinspires.org/
    seeds: ["https://www.firstinspires.org/programs/ftc/game-and-season"]
    selector: "main"
    min_items: 1
    note: Official FIRST marketing/season overview page. Program information, not the Competition Manual.
  - id: first-community-blog
    name: FIRST Community Blog — FTC topic posts
    source_type: community_blog
    kind: hub
    base: https://community.firstinspires.org/
    seeds: ["https://community.firstinspires.org/topic/ftc"]
    exclude: ["/topic/", "/author/", "/tag/", "/all/", "/programs", "subscribe", "/fll", "/frc", "/featured"]
    selector: "article"
    min_items: 5
    max_pages: 80
    note: Official FIRST community blog posts tagged FTC. Announcements and guidance, not game rules.
  - id: ftc-community-forum
    name: Official FTC Community Forum (ftc-community.firstinspires.org) public topics
    source_type: community_forum
    kind: sitemap
    base: https://ftc-community.firstinspires.org/
    include: ["/t/"]
    exclude: ["/login", "/signup", "/session", "/admin", "/my/"]
    selector: "div[itemprop=articleBody], .post, main"
    min_items: 10
    max_pages: 150
    delay_seconds: 1.5
    note: Public Discourse topics from the official FTC community forum (no login). Community Q&A and discussion — advice, not rules.
  - id: ftc-sdk
    name: FTC Robot Controller SDK README (raw) + v12.0 release notes
    source_type: sdk_docs
    kind: pages
    base: https://github.com/
    seeds:
      - "https://raw.githubusercontent.com/FIRST-Tech-Challenge/FtcRobotController/v12.0/README.md"
      - "https://github.com/FIRST-Tech-Challenge/FtcRobotController/releases/tag/v12.0"
    selector: ".markdown-body"
    min_items: 1
    note: Official FTC Android/Robot Controller SDK README and current-season (v12.0) release notes. Software docs, not game rules.
  - id: ftcsim
    name: FTCSIM (ftcsim.org) public product pages
    source_type: simulator_docs
    kind: pages
    base: https://ftcsim.org/
    seeds:
      - "https://ftcsim.org/"
      - "https://ftcsim.org/educators"
      - "https://ftcsim.org/competition-fields"
      - "https://ftcsim.org/eula"
    selector: "main"
    min_items: 1
    note: Third-party FTC simulator product pages. Practice tool documentation, not game rules. Some page chrome may mention CDN blocks on restricted networks.

# Skipped from BIOBUZZ digest (do not index):
# - https://ftc-events.firstinspires.org/2026 — site forbids scraping webpages for event data (robots/HTML comment);
#   landing HTML is a thin season shell; use the official Events API instead if results are needed later.
# - Reddit, Discord, Chief Delphi, FTCScout, Hive Vision — community watchlist only, never as rule proof.
